<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Cat — OC2CO Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060A14;
            --bg-navy: #0A0F1E;
            --bg-card: #0E1428;
            --cyan: #00E5FF;
            --cyan-glow: rgba(0, 229, 255, 0.15);
            --amber: #FFB300;
            --amber-glow: rgba(255, 179, 0, 0.15);
            --gold: #FFD700;
            --text-primary: #E8ECF4;
            --text-secondary: #8892A8;
            --text-muted: #5A6478;
            --border: rgba(0, 229, 255, 0.08);
            --border-hover: rgba(0, 229, 255, 0.2);
            --success: #34D399;
            --error: #F87171;
            --pad-0: #00E5FF;
            --pad-1: #F87171;
            --pad-2: #34D399;
            --pad-3: #FFB300;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-deep); color: var(--text-primary); overflow-x: hidden; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        h1, h2, h3, h4 { font-family: 'Orbitron', sans-serif; }

        .ambient-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .ambient-bg .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; }
        .ambient-bg .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(167,139,250,0.12), transparent 70%); top: -10%; left: 10%; animation: fo 22s ease-in-out infinite; }
        .ambient-bg .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(0,229,255,0.08), transparent 70%); bottom: 15%; right: -5%; animation: fo 28s ease-in-out infinite reverse; }
        @keyframes fo { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-20px) scale(1.05); } }
        .grid-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(0,229,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.015) 1px, transparent 1px); background-size: 60px 60px; }

        nav { position: fixed; top: 0; width: 100%; z-index: 100; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; background: rgba(6,10,20,0.85); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); }
        .nav-logo { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 1.4rem; letter-spacing: 0.08em; color: var(--amber); text-shadow: 0 0 20px var(--amber-glow); text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 1rem; }
        .nav-link { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); padding: 0.3rem 0.75rem; border: 1px solid rgba(0,229,255,0.08); border-radius: 100px; transition: all 0.3s; text-decoration: none; }
        .nav-link:hover { color: var(--cyan); border-color: var(--cyan); }

        .container { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding: 6rem 1.5rem 3rem; }

        .game-title { text-align: center; margin-bottom: 2rem; }
        .game-title h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; color: #A78BFA; margin-bottom: 0.5rem; }
        .game-title p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }

        .nickname-bar { display: flex; gap: 0.75rem; margin-bottom: 2rem; }
        .nickname-bar input { flex: 1; font-family: 'Inter', sans-serif; font-size: 0.9rem; padding: 0.7rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: rgba(14,20,40,0.8); color: var(--text-primary); outline: none; transition: border-color 0.3s; }
        .nickname-bar input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-glow); }
        .nickname-bar input::placeholder { color: var(--text-muted); }

        .game-board { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; margin-bottom: 1.5rem; }

        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .stat { text-align: center; }
        .stat-label { font-family: 'Orbitron', sans-serif; font-size: 0.55rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 800; }
        .stat-round { color: #A78BFA; }
        .stat-score { color: var(--gold); }
        .stat-best { color: var(--cyan); }

        /* SIMON PADS */
        .pads-container {
            width: 280px;
            height: 280px;
            margin: 0 auto 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            position: relative;
        }

        .pad {
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }
        .pad::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .pad-0 { background: rgba(0, 229, 255, 0.15); border: 2px solid rgba(0, 229, 255, 0.2); }
        .pad-0.lit, .pad-0:active { background: rgba(0, 229, 255, 0.6); border-color: var(--pad-0); box-shadow: 0 0 40px rgba(0, 229, 255, 0.5), inset 0 0 30px rgba(0, 229, 255, 0.2); }

        .pad-1 { background: rgba(248, 113, 113, 0.15); border: 2px solid rgba(248, 113, 113, 0.2); }
        .pad-1.lit, .pad-1:active { background: rgba(248, 113, 113, 0.6); border-color: var(--pad-1); box-shadow: 0 0 40px rgba(248, 113, 113, 0.5), inset 0 0 30px rgba(248, 113, 113, 0.2); }

        .pad-2 { background: rgba(52, 211, 153, 0.15); border: 2px solid rgba(52, 211, 153, 0.2); }
        .pad-2.lit, .pad-2:active { background: rgba(52, 211, 153, 0.6); border-color: var(--pad-2); box-shadow: 0 0 40px rgba(52, 211, 153, 0.5), inset 0 0 30px rgba(52, 211, 153, 0.2); }

        .pad-3 { background: rgba(255, 179, 0, 0.15); border: 2px solid rgba(255, 179, 0, 0.2); }
        .pad-3.lit, .pad-3:active { background: rgba(255, 179, 0, 0.6); border-color: var(--pad-3); box-shadow: 0 0 40px rgba(255, 179, 0, 0.5), inset 0 0 30px rgba(255, 179, 0, 0.2); }

        .pad.disabled { pointer-events: none; opacity: 0.4; }

        /* CENTER CIRCLE */
        .center-circle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            border-radius: 50%;
            background: var(--bg-deep);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .center-circle .cc-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .status-msg {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            min-height: 1.5rem;
        }
        .status-msg.watching { color: #A78BFA; }
        .status-msg.your-turn { color: var(--cyan); }
        .status-msg.wrong { color: var(--error); }
        .status-msg.correct { color: var(--success); }

        .start-btn {
            display: block;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.85rem;
            border-radius: 8px;
            border: none;
            background: #A78BFA;
            color: var(--bg-deep);
            cursor: pointer;
            transition: all 0.3s;
        }
        .start-btn:hover { box-shadow: 0 0 25px rgba(167,139,250,0.4); }

        /* MINI LEADERBOARD */
        .mini-lb { margin-top: 2rem; }
        .mini-lb h3 { font-size: 0.8rem; font-weight: 700; color: var(--gold); margin-bottom: 1rem; text-align: center; letter-spacing: 0.08em; }
        .mini-lb-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.75rem; border-bottom: 1px solid rgba(0,229,255,0.04); }
        .mini-lb-row:last-child { border: none; }
        .mini-lb-rank { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; width: 2rem; }
        .mini-lb-name { flex: 1; font-size: 0.85rem; color: var(--text-secondary); }
        .mini-lb-score { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--gold); }

        @media (max-width: 600px) {
            .container { padding: 5rem 1rem 2rem; }
            nav { padding: 0.85rem 1rem; }
            .pads-container { width: 240px; height: 240px; gap: 10px; }
            .center-circle { width: 50px; height: 50px; }
            .game-board { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>

<div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="grid-overlay"></div>

<nav>
    <a href="https://www.oc2co.com" class="nav-logo">OC2CO</a>
    <div class="nav-links">
        <a href="https://www.oc2co.com" class="nav-link">Home</a>
        <a href="store.html" class="nav-link">Store</a>
        <a href="games.html" class="nav-link">Arcade</a>
        <a href="chat.html" class="nav-link">Community</a>
    </div>
</nav>

<div class="container">
    <div class="game-title">
        <h1>Copy Cat</h1>
        <p>Watch the sequence. Repeat it perfectly. Each round adds one more. How far can you go?</p>
    </div>

    <div class="nickname-bar">
        <input type="text" id="nickname" placeholder="Your nickname..." maxlength="30">
    </div>

    <div class="game-board">
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Round</div>
                <div class="stat-value stat-round" id="roundNum">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value stat-score" id="scoreNum">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Best</div>
                <div class="stat-value stat-best" id="bestNum">0</div>
            </div>
        </div>

        <div class="pads-container" id="padsContainer">
            <div class="pad pad-0 disabled" data-pad="0"></div>
            <div class="pad pad-1 disabled" data-pad="1"></div>
            <div class="pad pad-2 disabled" data-pad="2"></div>
            <div class="pad pad-3 disabled" data-pad="3"></div>
            <div class="center-circle"><span class="cc-text">Copy Cat</span></div>
        </div>

        <div class="status-msg" id="statusMsg">Press Start to play</div>
        <button class="start-btn" id="startBtn" onclick="startGame()">Start Game</button>
    </div>

    <div class="mini-lb">
        <h3>Top Players</h3>
        <div id="miniLb"><div style="text-align:center;color:var(--text-muted);font-size:0.85rem;padding:1rem;">Loading...</div></div>
    </div>
</div>

<footer style="padding:2rem 1.5rem;text-align:center;border-top:1px solid rgba(0,229,255,0.08);"><p style="font-size:0.75rem;color:#5A6478;">&copy; 2026 <a href="index.html" style="color:#FFB300;text-decoration:none;">Oc2cO</a>. All rights reserved. &middot; <a href="https://www.oc2co.com" style="color:#FFB300;text-decoration:none;">Website</a></p></footer>

<script>
// ============ AUDIO CONTEXT ============
let audioCtx = null;
const FREQS = [329.63, 261.63, 392.00, 440.00]; // E4, C4, G4, A4

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(padIdx, duration = 300) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = FREQS[padIdx];
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration / 1000);
}

function playErrorSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.value = 100;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
}

// ============ GAME STATE ============
let sequence = [];
let playerInput = [];
let round = 0;
let score = 0;
let best = parseInt(localStorage.getItem('oc2co_copycat_best') || '0');
let isPlaying = false;
let isShowingSequence = false;
let isPlayerTurn = false;

const nicknameInput = document.getElementById('nickname');
nicknameInput.value = localStorage.getItem('oc2co_nickname') || '';
nicknameInput.addEventListener('input', () => localStorage.setItem('oc2co_nickname', nicknameInput.value));
document.getElementById('bestNum').textContent = best;

// ============ PAD HANDLING ============
const pads = document.querySelectorAll('.pad');
pads.forEach(pad => {
    pad.addEventListener('click', () => handlePadClick(parseInt(pad.dataset.pad)));
    pad.addEventListener('touchstart', (e) => { e.preventDefault(); handlePadClick(parseInt(pad.dataset.pad)); }, { passive: false });
});

function lightPad(idx, duration = 400) {
    const pad = document.querySelector(`.pad-${idx}`);
    pad.classList.add('lit');
    playTone(idx, duration);
    setTimeout(() => pad.classList.remove('lit'), duration);
}

function setPadsEnabled(enabled) {
    pads.forEach(p => {
        if (enabled) p.classList.remove('disabled');
        else p.classList.add('disabled');
    });
}

// ============ GAME LOGIC ============
function startGame() {
    initAudio();
    sequence = [];
    playerInput = [];
    round = 0;
    score = 0;
    isPlaying = true;
    document.getElementById('roundNum').textContent = '0';
    document.getElementById('scoreNum').textContent = '0';
    document.getElementById('startBtn').textContent = 'Restart';
    nextRound();
}

function nextRound() {
    round++;
    document.getElementById('roundNum').textContent = round;
    sequence.push(Math.floor(Math.random() * 4));
    playerInput = [];

    setStatus('Watch carefully...', 'watching');
    setPadsEnabled(false);
    isShowingSequence = true;

    // Show sequence with animation
    let delay = 600;
    const interval = Math.max(300, 600 - round * 20); // Speed up over time

    sequence.forEach((padIdx, i) => {
        setTimeout(() => {
            lightPad(padIdx, interval - 80);
        }, delay + i * interval);
    });

    setTimeout(() => {
        isShowingSequence = false;
        isPlayerTurn = true;
        setPadsEnabled(true);
        setStatus('Your turn!', 'your-turn');
    }, delay + sequence.length * interval + 200);
}

function handlePadClick(padIdx) {
    if (!isPlayerTurn || isShowingSequence) return;

    lightPad(padIdx, 200);
    playerInput.push(padIdx);

    const currentIdx = playerInput.length - 1;

    if (playerInput[currentIdx] !== sequence[currentIdx]) {
        // WRONG!
        gameOver();
        return;
    }

    if (playerInput.length === sequence.length) {
        // Round complete!
        isPlayerTurn = false;
        setPadsEnabled(false);
        score = round * 100;
        document.getElementById('scoreNum').textContent = score.toLocaleString();
        setStatus('Correct!', 'correct');

        setTimeout(() => nextRound(), 1000);
    }
}

function gameOver() {
    isPlaying = false;
    isPlayerTurn = false;
    setPadsEnabled(false);
    playErrorSound();

    const finalScore = (round - 1) * 100;
    score = finalScore;
    document.getElementById('scoreNum').textContent = finalScore.toLocaleString();

    if (round - 1 > best) {
        best = round - 1;
        localStorage.setItem('oc2co_copycat_best', best);
        document.getElementById('bestNum').textContent = best;
    }

    setStatus(`Game over! Round ${round - 1} — Score: ${finalScore}`, 'wrong');
    document.getElementById('startBtn').textContent = 'Play Again';

    // Flash all pads red briefly
    pads.forEach(p => { p.classList.add('lit'); setTimeout(() => p.classList.remove('lit'), 600); });

    if (finalScore > 0) submitScore(finalScore);
}

function setStatus(text, cls) {
    const el = document.getElementById('statusMsg');
    el.textContent = text;
    el.className = 'status-msg ' + (cls || '');
}

// ============ SCORE SUBMISSION ============
async function submitScore(score) {
    const nickname = nicknameInput.value.trim();
    if (!nickname) return;
    try {
        await fetch('/api/scores', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nickname,
                game: 'copycat',
                score,
                metadata: { rounds: round - 1 }
            })
        });
        loadMiniLb();
    } catch (e) { /* silent */ }
}

// ============ MINI LEADERBOARD ============
async function loadMiniLb() {
    try {
        const res = await fetch('/api/scores/copycat?limit=10');
        const data = await res.json();
        const container = document.getElementById('miniLb');
        if (!data.leaderboard || !data.leaderboard.length) {
            container.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:0.85rem;padding:1rem;">No scores yet. Be the first!</div>';
            return;
        }
        container.innerHTML = data.leaderboard.map((r, i) => {
            const colors = ['var(--gold)', '#C0C0C0', '#CD7F32'];
            const rc = colors[i] || 'var(--text-muted)';
            return `<div class="mini-lb-row"><span class="mini-lb-rank" style="color:${rc}">${i+1}</span><span class="mini-lb-name">${esc(r.nickname)}</span><span class="mini-lb-score">${r.score.toLocaleString()}</span></div>`;
        }).join('');
    } catch (e) {
        document.getElementById('miniLb').innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:0.85rem;padding:1rem;">Failed to load.</div>';
    }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ============ KEYBOARD SUPPORT ============
document.addEventListener('keydown', (e) => {
    if (document.activeElement === nicknameInput) return;
    const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3, 'q': 0, 'w': 1, 'a': 2, 's': 3 };
    if (keyMap[e.key] !== undefined && isPlayerTurn) handlePadClick(keyMap[e.key]);
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!isPlaying) startGame(); }
});

loadMiniLb();
</script>

<script>
(function() {
    var slug = 'oc2coos-2';
    if (!slug) return;
    var vid = localStorage.getItem('oc2co_vid');
    if (!vid) { vid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }); localStorage.setItem('oc2co_vid', vid); }
    new Image().src = 'https://app.oc2co.com/api/beacon/pixel?s=' + encodeURIComponent(slug) + '&v=' + encodeURIComponent(vid);
})();
</script>
</body>
</html>

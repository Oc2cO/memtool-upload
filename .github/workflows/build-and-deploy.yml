name: Build and Deploy MemTool iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          npm ci
          npx expo install --check

      - name: Export iOS bundle
        run: |
          npx expo export --platform ios
        env:
          EXPO_PUBLIC_REPLIT_API_BASE_URL: https://www.oc2co.com
          EXPO_PUBLIC_AUTH_API_BASE_URL: https://www.oc2co.com/api/memtool

      - name: Setup ASC API Key
        if: github.event_name == 'workflow_dispatch'
        env:
          API_KEY_CONTENT: ${{ secrets.API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch'
        env:
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
        run: |
          # Find the exported app bundle
          BUNDLE=$(find dist -name "*.app" -type d | head -1)
          if [ -z "$BUNDLE" ]; then
            # Try .ipa if prebuilt
            IPA=$(find dist -name "*.ipa" | head -1)
            if [ -n "$IPA" ]; then
              xcrun altool --upload-app -f "$IPA" -t ios \
                --apiKey "$API_KEY_ID" \
                --apiIssuer "$API_ISSUER_ID"
            else
              echo "No .app or .ipa found in dist/"
              exit 1
            fi
          else
            echo "App bundle found at: $BUNDLE"
            echo "Manual packaging may be needed for .app upload"
          fi

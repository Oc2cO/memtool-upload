name: Upload to App Store

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download IPA from release
        run: |
          curl -L -o app.ipa "$(gh release view ${{ github.event.release.tag_name }} --json assets -q '.assets[0].url')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app -f app.ipa -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APP_PASSWORD }}"

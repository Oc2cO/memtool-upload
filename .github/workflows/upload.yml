name: Upload to App Store

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download IPA from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o app.ipa \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.release.assets[0].id }}"

      - name: Setup API Key
        env:
          API_KEY_CONTENT: ${{ secrets.API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f app.ipa -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

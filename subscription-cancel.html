<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Cancelled — MemTool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #060A14;
      --bg-card: #0D1425;
      --cyan: #00E5FF;
      --amber: #FFB300;
      --amber-light: #FFD54F;
      --text-primary: #E8ECF4;
      --text-secondary: #8892A8;
      --border: rgba(0,229,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .orb-1 {
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,179,0,0.1), transparent 70%);
      border-radius: 50%; filter: blur(120px);
      top: -80px; left: -80px;
      animation: float 22s ease-in-out infinite;
    }
    .orb-2 {
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,229,255,0.06), transparent 70%);
      border-radius: 50%; filter: blur(100px);
      bottom: -60px; right: -60px;
      animation: float 18s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(-20px,20px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .container {
      position: relative; z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 460px;
      animation: fadeInUp 0.6s ease forwards;
    }
    .icon-ring {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: rgba(255,179,0,0.08);
      border: 2px solid rgba(255,179,0,0.25);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      font-size: 2.8rem;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }
    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      display: inline-block;
      background: linear-gradient(135deg, var(--amber), #E65100);
      color: #060A14;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 24px rgba(255,179,0,0.2);
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 36px rgba(255,179,0,0.35);
    }
    .btn-secondary {
      display: inline-block;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 12px 32px;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.08);
      transition: border-color 0.2s, color 0.2s;
      width: 100%;
    }
    .btn-secondary:hover {
      border-color: rgba(0,229,255,0.2);
      color: var(--cyan);
    }
    .note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
  </div>
  <div class="container">
    <div class="icon-ring">💭</div>
    <h1>No worries.</h1>
    <p>Checkout was cancelled — nothing was charged. Your free plan is still active. Whenever you're ready to go Pro, it's $4.99/month.</p>
    <div class="actions">
      <button class="btn-primary" onclick="tryAgain()">Try Again</button>
      <a href="index.html" class="btn-secondary">Back to MemTool</a>
    </div>
    <p class="note">Questions? Contact us at support@oc2co.com</p>
  </div>
  <script>
    function tryAgain() {
      const token = localStorage.getItem('mt_token') || sessionStorage.getItem('mt_token');
      if (!token) {
        window.location.href = '/';
        return;
      }
      fetch('/api/memtool/subscription/checkout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
      })
      .then(r => r.json())
      .then(data => {
        if (data.checkout_url) {
          window.location.href = data.checkout_url;
        } else {
          alert('Something went wrong. Please try again from the app.');
        }
      })
      .catch(() => {
        alert('Connection error. Please try again.');
      });
    }
  </script>
</body>
</html>
